<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三目並べ</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px 14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f7f8fc;color:#182230}main{max-width:430px;margin:auto}h1{text-align:center}.sub{text-align:center;color:#667085}.status{padding:14px;background:#eaf1ff;border-radius:12px;text-align:center;font-weight:bold;min-height:52px;line-height:1.4}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;aspect-ratio:1}.cell{border:2px solid #cbd5e1;border-radius:14px;background:white;font-size:clamp(54px,18vw,86px);font-weight:bold;color:#2563eb;touch-action:manipulation}.cell.x{color:#d9485f}.cell.winner{background:#dff8e8;border-color:#16a34a}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button.action,select{min-height:46px;border:1px solid #cbd5e1;border-radius:10px;background:white;padding:8px;font-size:16px}button.primary{background:#2563eb;color:white}.score{display:flex;justify-content:space-around;background:white;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:14px;text-align:center}.score strong{display:block;font-size:22px}.small{text-align:center;color:#667085;font-size:12px;line-height:1.5}
</style></head><body><main><h1>⭕ 三目並べ ❌</h1><p class="sub">マスをタップして遊びます</p><label for="mode"><b>対戦モード</b></label><select id="mode" style="width:100%;margin:8px 0 14px"><option value="computer">コンピューター対戦（自動で×）</option><option value="chatgpt">ChatGPT対戦（×は手動で反映）</option></select><div id="status" class="status">あなた（○）の番です</div><div id="board" class="board"></div><div class="controls"><button id="restart" class="action primary">もう一度遊ぶ</button><button id="undo" class="action">一手戻す</button></div><div class="score"><div>あなた（○）<strong id="hs">0</strong></div><div>引き分け<strong id="ds">0</strong></div><div><span id="opp">コンピューター（×）</span><strong id="cs">0</strong></div></div><p id="help" class="small">コンピューターは最善手を選びます。引き分けにはできますが、勝つのは難しい相手です。</p></main><script>
(()=>{'use strict';const el=id=>document.getElementById(id),board=el('board'),status=el('status'),mode=el('mode'),wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let b=[],hist=[],turn='h',over=false,line=[],score={h:0,d:0,c:0};function result(a){for(const l of wins)if(a[l[0]]&&a[l[0]]===a[l[1]]&&a[l[1]]===a[l[2]])return{w:a[l[0]],l};return a.every(Boolean)?{w:'d',l:[]}:null}function mm(a,comp){let r=result(a);if(r)return{v:r.w==='c'?10:r.w==='h'?-10:0};let best={v:comp?-99:99,i:-1};for(let i=0;i<9;i++)if(!a[i]){a[i]=comp?'c':'h';let v=mm(a,!comp).v;a[i]='';if(comp?v>best.v:v<best.v)best={v,i}}return best}function save(){hist.push({b:b.slice(),turn,over,line:line.slice()})}function render(){board.replaceChildren();b.forEach((v,i)=>{let q=document.createElement('button');q.className='cell'+(v==='c'?' x':'')+(line.includes(i)?' winner':'');q.textContent=v==='h'?'○':v==='c'?'×':'';q.setAttribute('aria-label',`${i+1}番のマス ${v?'使用済み':'空き'}`);q.disabled=!!v||over||(turn==='c'&&mode.value==='computer');q.onclick=()=>play(i);board.appendChild(q)});el('hs').textContent=score.h;el('ds').textContent=score.d;el('cs').textContent=score.c}function finish(){let r=result(b);if(!r)return false;over=true;line=r.l;if(r.w==='h'){status.textContent='あなたの勝ちです！おめでとうございます 🎉';score.h++}else if(r.w==='c'){status.textContent=mode.value==='chatgpt'?'ChatGPT（×）の勝ちです！':'コンピューターの勝ちです！';score.c++}else{status.textContent='引き分けです！';score.d++}render();return true}function play(i){if(over||b[i])return;if(turn==='h'){save();b[i]='h';if(finish())return;if(mode.value==='chatgpt'){turn='c';status.textContent='ChatGPTの手番です。音声で相談し、指定された空きマスをタップして×を置いてください。';render();return}turn='c';status.textContent='コンピューターが考えています…';render();setTimeout(()=>{if(over)return;let m=mm(b.slice(),true).i;if(m>=0)b[m]='c';if(!finish()){turn='h';status.textContent='あなた（○）の番です';render()}},220)}else if(mode.value==='chatgpt'){save();b[i]='c';if(finish())return;turn='h';status.textContent='あなた（○）の番です。○を置いたら、盤面をChatGPTに伝えて次の手を聞いてください。';render()}}function reset(){b=Array(9).fill('');hist=[];over=false;line=[];turn='h';status.textContent='あなた（○）の番です。先に○を置いてください。';render()}el('restart').onclick=reset;el('undo').onclick=()=>{if(!hist.length)return;let s=hist.pop();b=s.b;turn=s.turn;over=s.over;line=s.line;status.textContent='一手戻しました。盤面を確認して続けてください。';render()};mode.onchange=()=>{el('opp').textContent=mode.value==='chatgpt'?'ChatGPT（×）':'コンピューター（×）';el('help').textContent=mode.value==='chatgpt'?'ChatGPT対戦では、○を置いた後に音声で相談し、指定された空きマスをタップすると×が置かれます。':'コンピューターは最善手を選びます。引き分けにはできますが、勝つのは難しい相手です。';reset()};reset()})();
</script></body></html>
